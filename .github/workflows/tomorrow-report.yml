name: Tomorrow content digest to Telegram

on:
  schedule:
    - cron: "13 12 * * *"  # 15:13 по Москве (MSK = UTC+3) — сдвиг от начала часа снижает риск задержки в GitHub Actions
  workflow_dispatch: {}    # позволяет запустить вручную для теста

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install openpyxl
      - name: Run tomorrow digest script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_tomorrow.py
